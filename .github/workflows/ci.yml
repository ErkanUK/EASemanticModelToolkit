name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build EASemanticModelToolkit.csproj --configuration Release
      - run: dotnet run --project components/importer/tests/EAJsonModelImporter.Tests.csproj --configuration Release
      - run: dotnet run --project components/exporter/tests/EA17LinkMLExporter.Tests.csproj --configuration Release
